# config.yaml — настройки, которые можно показывать (СТАРТЕР)
#
# Источники:
#   data/app_config.txt   какие ключи бывают, какие из них секретные,
#                         какие значения согласованы
#   data/services.txt     имена и порты служб, плюс как работает DNS
#
# Одна настройка в ConfigMap не попадёт никогда — реши, какая, и почему.
# Одной нет в согласованных значениях — её надо вывести.

apiVersion: v1
kind: ConfigMap
metadata:
  name: aurora-config
  namespace: aurora
  labels:
    app: aurora-api
data:
  # TODO: адрес mesh-collector. Схема, имя, порт.
  AURORA_MESH_URL:

