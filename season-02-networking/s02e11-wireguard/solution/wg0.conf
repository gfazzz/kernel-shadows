# /etc/wireguard/wg0.conf — узел Макса (ЭТАЛОН)
#
# Установка:
#   sudo install -m 0600 wg0.conf /etc/wireguard/wg0.conf
#   sudo wg-quick up wg0
# Проверка:
#   sudo wg show            # рукопожатия, объём трафика, кто когда отвечал
#   ip route show dev wg0   # какие маршруты создались из AllowedIPs

[Interface]
Address = 10.77.0.4/32
PrivateKey = dVxiUqb7JgABSGu5dqlEzyfwrxI3Fn1yfcyG9FbEPps=
DNS = 10.50.0.53

[Peer]
# шлюз операции: через него — вся внутренняя сеть и остальные узлы VPN
PublicKey = Vkxt97L+ElJY4+u1Vw3mXOwAcqfBWawRG9u6g+FoqBA=
Endpoint = vpn.ops.example:51820
AllowedIPs = 10.50.0.0/16, 10.77.0.1/32
PersistentKeepalive = 25

[Peer]
# Анна: прямой канал, только её адрес
PublicKey = sGA0Im1LFnYLXyTXTd8n/RH4PW1GzNdZOzLpXfxDhuo=
AllowedIPs = 10.77.0.5/32
PersistentKeepalive = 25

# ---------------------------------------------------------------------------
# ПОЧЕМУ ИМЕННО ТАК
#
# AllowedIPs пиров не пересекаются — это главное.
#   WireGuard не имеет понятия «клиент» и «сервер». Отправляя пакет, он
#   смотрит адрес назначения и ищет пира, в чьём AllowedIPs этот адрес
#   есть. Если у двух пиров стоит 0.0.0.0/0, второй не получит ничего
#   никогда: первый подходит под любой адрес. Именно поэтому в стартере
#   «до Анны трафик не доходит» — её пир мёртв, хотя описан верно.
#   Это называется cryptokey routing: маршрутизация и права доступа —
#   одна и та же таблица.
#
# AllowedIPs шлюза = 10.50.0.0/16, 10.77.0.1/32.
#   Внутренняя сеть операции плюс адрес самого шлюза. Не 0.0.0.0/0:
#   весь остальной трафик (почта, браузер, обновления) должен идти
#   обычным путём — это раздельное туннелирование. Полный туннель
#   (0.0.0.0/0) нужен, когда цель — скрыть весь трафик, и тогда пир
#   должен быть ровно один.
#
# Address = 10.77.0.4/32.
#   Маска /32 означает «на этом интерфейсе живёт ровно один адрес — мой».
#   С /24 ядро создаст маршрут на всю подсеть VPN через wg0, и он вступит
#   в спор с AllowedIPs каждого пира. Для WireGuard /32 — норма, а не
#   странность: сеть описывается не маской интерфейса, а списками пиров.
#
# PersistentKeepalive = 25.
#   Наш узел за NAT. Запись в таблице трансляции живёт секунд 30–120;
#   когда она истекает, снаружи до нас не достучаться, и соединение
#   «работает, пока я что-то отправляю». 25 секунд — общепринятое
#   значение: меньше самого короткого таймаута NAT. Тем, кто с белым
#   адресом и никуда не инициирует соединения, keepalive не нужен.
#
# Endpoint только у шлюза.
#   Endpoint — это «где искать пира». У Анны его нет: она тоже за NAT,
#   и её адрес меняется. Первое, что она отправит нам, обновит endpoint
#   автоматически — WireGuard запоминает адрес, с которого пришёл
#   корректно подписанный пакет.
#
# DNS = 10.50.0.53.
#   Внутренние имена (`db.internal`) разрешает только сервер операции.
#   Без этой строки имена из s02e04 не разрешатся, хотя адреса доступны.
#
# ListenPort не задан.
#   Для узла, который сам инициирует соединения, фиксированный порт не
#   нужен и даже вреден: случайный порт хуже сопоставляется с вами при
#   наблюдении за трафиком. Порт обязателен только тому, к кому приходят.
#
# Права на файл — 0600.
#   В нём приватный ключ. `wg-quick` предупредит о более широких правах,
#   но не откажется работать — проверять надо самому (см. s01e15).
