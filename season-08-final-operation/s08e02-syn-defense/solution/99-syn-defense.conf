# 99-syn-defense.conf — параметры стека под SYN-флудом (ЭТАЛОН)
#
# Кладётся в /etc/sysctl.d/, применяется `sysctl --system`.
# Каждая строка снабжена причиной: параметр без причины — суеверие
# (правило s07e10, здесь оно действует под нагрузкой).

# ── 1. Не хранить состояние по тем, кто не завершает рукопожатие ──
#
# Единственная мера, которая действительно снимает эту атаку. При
# переполнении очереди ядро перестаёт выделять память под полуоткрытое
# соединение и отвечает syn-cookie: состояние уезжает в номер пакета и
# возвращается только от настоящего клиента.
#
# Значение 1 — «включать при переполнении», то есть по факту атаки.
# Значение 2 — «всегда», отладочный режим: теряются опции TCP у всех
# соединений, включая нормальные.
net.ipv4.tcp_syncookies = 1

# ── 2. Дать очереди запас, чтобы cookies включались не мгновенно ──
#
# 128 — предел, оставшийся от установки по умолчанию; обычный темп новых
# соединений здесь 1180 в секунду по 99-му перцентилю, то есть очередь
# переполнялась бы и без всякой атаки на любом всплеске.
net.ipv4.tcp_max_syn_backlog = 8192

# Очередь принятия: сколько установленных соединений ждут accept().
# Держим на уровне очереди полуоткрытых, иначе узкое место просто
# переезжает на шаг вперёд (см. s07e08).
net.core.somaxconn = 8192

# ── 3. Быстрее отпускать то, что не завершится ──
#
# Пять повторов SYN+ACK — это около 31 секунды удержания записи ради
# клиента, которого не существует. Два повтора — около 7 секунд;
# настоящему клиенту с потерей пакета этого хватает.
net.ipv4.tcp_synack_retries = 2

# ── 4. Чего делать НЕЛЬЗЯ, и это записано явно ──
#
# Сброс соединения при переполнении очереди принятия. Под атакой
# «помогает» тем, что рвёт соединения настоящих клиентов вместо того,
# чтобы дать им подождать. Оставляем выключенным сознательно.
net.ipv4.tcp_abort_on_overflow = 0

# ── 5. Очередь на входе в стек ──
#
# Два с половиной миллиона пакетов в секунду упираются не только в TCP:
# пакеты копятся между драйвером и стеком. 1000 — значение времён
# гигабитных карт.
net.core.netdev_max_backlog = 65536

# ── 6. Отбрасывать пакеты с адресом, которого быть не может ──
#
# Обратная проверка маршрута: пакет, пришедший не с того интерфейса,
# через который к его отправителю есть маршрут, отбрасывается. Часть
# подделанных адресов отсекается бесплатно, ещё до правил фильтра.
# Значение 1 — строгий режим, годится для узла с одним маршрутом наружу.
net.ipv4.conf.all.rp_filter = 1

# ── 7. Таблица отслеживания соединений ──
#
# Каждое соединение занимает запись; при переполнении новые молча
# отбрасываются, и это выглядит как отказ сети, а не как переполнение.
net.netfilter.nf_conntrack_max = 262144
