# deployment.yaml — манифест aurora-api (СТАРТЕР)
#
# Скопируй в artifacts/ и заполни. Каждое TODO закрывается числом, которое
# получено из data/, а не выбрано на глаз:
#
#   data/usage.txt              p50, p95 и максимум потребления за неделю
#   data/capacity.txt           сколько свободной памяти на каждом узле
#   data/startup.txt            сколько длится холодный старт
#   data/endpoints.txt          какая ручка что спрашивает, какие переменные нужны
#   data/registry_tags.txt      какие теги образа существуют
#   data/current_deployment.yaml  как это выглядит сейчас (не образец)
#
# Отступ — два пробела. Блочная запись, без {} и []: проверяющий скрипт
# читает подмножество YAML и на потоковой записи сдастся.
#
#   cp starter/deployment.yaml artifacts/
#   bash tests/test.sh

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-api
  namespace: aurora
  labels:
    app: aurora-api
spec:
  # Сколько реплик заказано. Менять желаемое не нужно — нужно сделать его
  # исполнимым.
  replicas:

  selector:
    matchLabels:
      app: aurora-api

  template:
    metadata:
      labels:
        app: aurora-api
    spec:
      containers:
        - name: aurora-api
          # TODO: образ с тегом, который есть в registry_tags.txt.
          image: registry.verne.internal/aurora-api:

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              # TODO: сколько памяти резервировать под каждую реплику.
              # Ориентир — обычное потребление, а не пик. И проверь по
              # capacity.txt, что пять таких реплик действительно встают:
              # планировщик кладёт под целиком на один узел.
              memory:
              # TODO: то же для процессора.
              cpu:
            limits:
              # TODO: потолок памяти. Ниже пика — это OOMKilled с кодом 137,
              # который уже видели в s07e01. Плюс запас из usage.txt.
              memory:
              # TODO: потолок процессора — или убери строку совсем.
              # Подумай, чем предел на CPU отличается от предела на память.
              cpu:

          # TODO: переменные окружения. Одной из них не хватало поду dk3np.
          # Та, что содержит пароль, приходит ссылкой на Secret, а не
          # значением: этот файл лежит в git.
          env:
            - name:
              valueFrom:
                secretKeyRef:
                  name: aurora-db
                  key: dsn

          # TODO: три пробы. У каждой свой вопрос — см. endpoints.txt.
          #   startupProbe   «уже поднялся?»   бюджет считается из startup.txt
          #   readinessProbe «можно трафик?»
          #   livenessProbe  «не завис?»
          # Проба живости не должна ходить во внешние системы.
          startupProbe:
            httpGet:
              path:
              port: 8080
            periodSeconds:
            failureThreshold:

          readinessProbe:
            httpGet:
              path:
              port: 8080
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path:
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
