# mosquitto.conf — брокер сети shadow_mesh (ЭТАЛОН, s06e09)
#
# Закрывает находки разбора s06e08: открытый обмен, анонимный доступ,
# отсутствие прав по темам, общий пароль, потерю сессий при перезапуске.
#
# Правило чтения: у mosquitto порядок директив значения не имеет, но
# listener начинает СЕКЦИЮ — всё, что идёт после него, относится к нему.

# ── Единственный слушатель: MQTT внутри TLS ─────────────────────────
# Порта 1883 здесь нет вовсе. Оставить его «на время миграции» —
# значит оставить дверь, через которую пароль снова уйдёт в эфир.
listener 8883

# Сертификат удостоверяющего центра, сертификат и ключ брокера.
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile /etc/mosquitto/certs/broker.key

# Ниже 1.2 не опускаемся: в 1.0 и 1.1 есть известные слабости.
tls_version tlsv1.2

# ── Кто подключается ────────────────────────────────────────────────
# Аноним не подключится вовсе.
allow_anonymous false
# У каждого устройства и каждой панели своя учётная запись: имя клиента
# становится частью правил доступа (%u в acl).
password_file /etc/mosquitto/passwd

# ── Что кому можно ──────────────────────────────────────────────────
acl_file /etc/mosquitto/acl

# ── Сессии переживают перезапуск ────────────────────────────────────
persistence true
persistence_location /var/lib/mosquitto/
# Очередь отключённого клиента ограничена: узел, пропавший на сутки,
# не должен съесть память брокера.
max_queued_messages 1000

# ── Журнал ──────────────────────────────────────────────────────────
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
# Имя клиента в журнале подключений — без него разбор вроде s06e08
# невозможен: непонятно, кто именно подписался.
connection_messages true
