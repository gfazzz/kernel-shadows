# engagement.conf — правила ведения контрнаступления (ЭТАЛОН)
#
# Файл читается инструментом перед каждым действием: он либо находит здесь
# явное разрешение, либо не выполняет действие. Умолчание — запрет.
# Это конфигурация (Type B): решение принимает файл, а не человек в азарте.

# ── Ссылка на ордер ───────────────────────────────────────────────
# Без действующего ордера весь файл недействителен.
case_id       NE-2026-INT-0041
honor_window  yes        # действия только в интервале valid_from…valid_until

# ── Область: default-deny ─────────────────────────────────────────
# Разрешены только сети из ордера. Всё, что не входит в них, — запрещено
# автоматически, без отдельной строки на каждый чужой адрес.
default       deny
allow_scope   203.0.113.0/24
allow_scope   198.51.100.64/26

# ── Действия ──────────────────────────────────────────────────────
# Разрешаются только перечисленные в ордере. Запрещённые ордером
# повторены явно: разрушение, отказ в обслуживании и порча остаются
# запрещёнными, даже если цель в области, — «ответить тем же» не является
# ни законным, ни полезным.
allow_action  scan
allow_action  evidence-collect
deny_action   ddos
deny_action   destroy
deny_action   deface

# ── Раскрытие: PII вычищается ─────────────────────────────────────
# Технические поля остаются — они и есть доказательство. Персональные
# данные жертв не публикуются: раскрытие направлено против нападавших, а
# не против пострадавших.
disclosure_redact_pii  yes
disclosure_channel     interpol   # сначала координатору, не сразу в прессу

# ── Умолчание для всего, что не описано выше ──────────────────────
# Новый вид действия, не упомянутый ни в allow, ни в deny, запрещён.
on_unlisted   deny
