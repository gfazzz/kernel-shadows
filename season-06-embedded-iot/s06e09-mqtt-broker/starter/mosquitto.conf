# mosquitto.conf — брокер сети shadow_mesh (СТАРТЕР, s06e09)
#
# Задача: закрыть все находки из data/findings.txt.
#
# Синтаксис: «директива значение», по одной на строку. Директива listener
# начинает СЕКЦИЮ: всё, что идёт после неё, относится к этому слушателю.
#
# Что задать (пути и порты — из data/, придумывать не надо):
#   * единственный слушатель — на TLS-порту; порта без шифрования быть
#     не должно вовсе, даже «временно, для миграции»
#   * cafile, certfile, keyfile — из data/tls_material.txt
#   * минимальная версия TLS — оттуда же
#   * анонимный доступ запрещён; файл паролей задан
#   * файл прав по темам задан
#   * сессии переживают перезапуск, очередь отключённого клиента
#     ограничена (иначе пропавший узел съест память брокера)
#   * журнал пишется в файл, и в нём видны имена подключающихся клиентов
#
# Правь копию в artifacts/, потом проверяй:  bash tests/test.sh

