# service.yaml — постоянный адрес для непостоянного набора подов (ЭТАЛОН)

apiVersion: v1
kind: Service
metadata:
  name: aurora-api
  namespace: aurora
  labels:
    app: aurora-api
spec:
  # ClusterIP: служба внутренняя, снаружи к ней не ходят. NodePort открыл бы
  # порт на каждом узле кластера — включая те, где пода нет.
  type: ClusterIP

  # Селектор ищет поды по меткам, а не по имени Deployment: Service вообще
  # не знает, что Deployment существует. Метка app=aurora-api стоит в
  # шаблоне пода и переживает выкат.
  #
  # pod-template-hash сюда не пишут: он меняется при каждой правке шаблона,
  # и селектор с ним перестаёт находить кого бы то ни было после первого же
  # обновления — ровно то, что случилось с черновиком в data/.
  selector:
    app: aurora-api

  ports:
    # Имя порта пригодится дальше: по нему на службу подпишется Prometheus.
    - name: http
      protocol: TCP
      # port — то, на что стучатся клиенты: mesh-collector:8080.
      port: 8080
      # targetPort — куда служба перекладывает соединение. Указан именем
      # порта контейнера, а не числом: поменяется 8080 в приложении —
      # править придётся в одном месте, в манифесте Deployment.
      targetPort: http
