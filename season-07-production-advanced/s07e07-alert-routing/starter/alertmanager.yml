# alertmanager.yml — кому и как сообщать (СТАРТЕР)
#
# Источники:
#   data/night.txt                журнал ночи с восемью звонками
#   data/policy.txt               о чём договорились после неё
#   data/alert_labels.txt         какие метки несут оповещения из s07e06
#   data/current_alertmanager.yml как было — не образец
#
# Задача не в том, чтобы доставить все оповещения. Задача в том, чтобы
# ночью прозвучал один звонок на одну аварию.

global:
  resolve_timeout: 5m

route:
  # TODO: приёмник по умолчанию. Оповещение, не подошедшее ни под одну
  # ветку, обязано куда-то попасть — вопрос куда.
  receiver:

  # TODO: по каким меткам склеивать. Подумай, почему alertname сюда не
  # годится: что он склеит и что разнесёт.
  group_by:

  # TODO: три выдержки. Минимумы — в policy.txt, но поймите, за что
  # отвечает каждая: первое сообщение группы, дополнение группы,
  # напоминание о том, что всё ещё горит.
  group_wait:
  group_interval:
  repeat_interval:

  routes:
    # TODO: ветка для симптомов, видимых пользователю.
    - matchers:
        - severity = page
      receiver:

    # TODO: ветка для всего остального.
    - matchers:
        - severity = ticket
      receiver:

# TODO: подавление следствий. Если цель недоступна, её ошибки, задержка и
# перезапуски — это та же недоступность, увиденная с трёх сторон.
# Не забудь equal: без него одна упавшая цель заглушит весь кластер.
inhibit_rules:
  - source_matchers:
      - alertname =
    target_matchers:
      - alertname =
    equal:
      -

receivers:
  # TODO: два приёмника. Адрес с учётными данными в этот файл не пишут —
  # файл лежит в git. Alertmanager умеет читать адрес из отдельного файла.
  - name:
    webhook_configs:
      - url_file:
