# zeroday-mitigation.conf — временная мера против NE-2026-0041 (СТАРТЕР)
#
# Патча нет и не будет три дня. Задача — закрыть ровно то, при чём
# исполняется код, не выключая сам сервис.
#
# Что даёт каркас: место, форму и три обязательные строки заголовка.
# Чем закрывать — решаешь сам, читая advisory.txt и service_map.txt.
#
# Формат — фрагмент конфигурации nginx, подключаемый из server-блока до
# общего location /. Действующий конфиг — в data/nginx_current.conf.
#
# Тест прогонит по твоей мере корпус запросов из data/request_corpus.txt
# и проверит две вещи: что ни одна попытка эксплуатации не прошла и что
# ни один законный запрос не потерян. Второе ломается чаще первого.

# ── Заголовок меры: без него она останется навсегда ───────────────
#
# advisory:     идентификатор бюллетеня, по которому меру можно найти
# expires:      день операции, после которого мера считается просроченной
#               (сегодня 57-й; исправление обещают через три дня)
# remove-when:  условие снятия — что должно случиться, чтобы блок удалить
#
# advisory:
# expires:
# remove-when:

# ── Сама мера ─────────────────────────────────────────────────────
#
# Подсказка по форме, а не по содержанию:
#   location = <путь> { ... }        точное совпадение пути
#   client_max_body_size <N>k;       предел тела запроса
#   if ($http_<заголовок> ~* ...)    проверка заголовка, внутри — return
#   limit_except <МЕТОД> { deny all; }   разрешить только эти методы
#   access_log <файл> combined;      отдельный журнал срабатываний
#   proxy_pass http://aurora_backend;    куда передавать то, что прошло

location = {
}
