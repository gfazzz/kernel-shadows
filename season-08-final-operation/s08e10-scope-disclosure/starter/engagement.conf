# engagement.conf — правила ведения контрнаступления (СТАРТЕР)
#
# Инструмент читает этот файл перед каждым действием: находит явное
# разрешение — выполняет, не находит — отказывает. Умолчание — запрет.
# Решает файл, а не человек в азарте: в этом смысл Type B.
#
# Источники — в data/:
#   authorization.txt   ордер: область, разрешённые и запрещённые действия
#   targets.txt         заявки команды — что предлагают сделать
#   evidence_fields.txt поля доказательств: что технически, что персонально
#
# Задача: перенести ордер в правила так, чтобы каждая заявка получала
# верное решение. Область НЕ шире ордера, запреты видны явно, PII при
# раскрытии вычищается.
#
# Правь копию в artifacts/, потом проверяй:  bash tests/test.sh

# ── Ссылка на ордер ───────────────────────────────────────────────
case_id
honor_window

# ── Область: default-deny ─────────────────────────────────────────
# Одна строка умолчания и по строке allow_scope на каждую сеть ордера.
default
# allow_scope  <CIDR>

# ── Действия ──────────────────────────────────────────────────────
# allow_action на каждое разрешённое, deny_action на каждое запрещённое.
# Запреты повторяются явно, хотя default-deny и так бы сработал: запрет
# должен быть виден тому, кто читает файл.

# ── Раскрытие ─────────────────────────────────────────────────────
disclosure_redact_pii
disclosure_channel

# ── Умолчание для незаявленного ───────────────────────────────────
on_unlisted
