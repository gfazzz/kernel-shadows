# ─────────────────────────────────────────────────────────────
# SHADOW AGENT — конфигурация канала связи
# Заполняется оператором перед первым подключением.
# Значения берутся из файла доступа (.next_server) на «сервере».
# ─────────────────────────────────────────────────────────────

# Адрес узла, к которому подключается агент
server = CHANGE_ME

# Порт SSH
port = CHANGE_ME

# Имя пользователя
user = CHANGE_ME

# Шифрование канала. Включить обязательно:
# раскомментируй строку ниже (убери # и пробел в начале)
# encryption = on

# Отладочный лог пишет в открытом виде всё, включая параметры доступа.
# Перед боевым подключением должен быть выключен.
debug_log = true

# Таймаут подключения в секундах (менять не нужно)
timeout = 30
