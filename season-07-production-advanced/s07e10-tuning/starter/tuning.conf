# tuning.conf — параметры ядра для verne-w1 (СТАРТЕР)
#
# Кладётся в /etc/sysctl.d/90-aurora.conf, применяется `sysctl --system`.
#
# Источники:
#   data/measurements.txt   что измерено и что из этого требует изменения
#   data/requirements.txt   какие параметры обязаны быть и каким свойством
#   data/allowed.txt        какие параметры вообще есть в этом ядре
#   data/harmful.txt        что кочует из статьи в статью и почему не надо
#   data/current_sysctl.txt что действует сейчас
#   data/cargo_cult.conf    файл из блога — не образец
#
# ПРАВИЛО ФАЙЛА: у каждой строки есть обоснование, и в обосновании стоит
# идентификатор измерения (M1, M4, …). Параметр без измерения — не
# настройка, а суеверие: через год никто не вспомнит, зачем он здесь и
# можно ли его убрать.
#
# Формат: «параметр = значение», обоснование — комментарии над строкой.

