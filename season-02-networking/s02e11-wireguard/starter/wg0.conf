# /etc/wireguard/wg0.conf — узел Макса (СТАРТЕР)
#
# Дмитрий поднял VPN за вечер и раздал всем один и тот же конфиг,
# поменяв только адрес. Соединение устанавливается — и на этом
# хорошие новости заканчиваются: до Анны трафик не доходит, а через
# полминуты простоя перестаёт доходить вообще никуда.
#
# Правь этот файл в artifacts/, потом проверяй:  bash tests/test.sh
#
# Как WireGuard выбирает, куда отправить пакет:
#   он смотрит адрес назначения и ищет пира, в чьём AllowedIPs этот
#   адрес есть. Первый подошедший и получает пакет. Поэтому AllowedIPs
#   двух пиров НЕ ДОЛЖНЫ пересекаться — иначе один из них мёртв.
#
# Что должно получиться (подробности — в mission.md):
#   доступ в сеть операции через шлюз, прямой канал до Анны,
#   соединение, которое переживает простой за NAT.

[Interface]
Address = 10.77.0.4/24
PrivateKey = dVxiUqb7JgABSGu5dqlEzyfwrxI3Fn1yfcyG9FbEPps=
ListenPort = 51820

[Peer]
# шлюз в сеть операции
PublicKey = Vkxt97L+ElJY4+u1Vw3mXOwAcqfBWawRG9u6g+FoqBA=
Endpoint = vpn.ops.example:51820
AllowedIPs = 0.0.0.0/0

[Peer]
# Анна, прямой канал
PublicKey = sGA0Im1LFnYLXyTXTd8n/RH4PW1GzNdZOzLpXfxDhuo=
AllowedIPs = 0.0.0.0/0
