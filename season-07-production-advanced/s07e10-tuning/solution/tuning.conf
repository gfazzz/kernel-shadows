# tuning.conf — параметры ядра для verne-w1 (ЭТАЛОН)
#
# Кладётся в /etc/sysctl.d/90-aurora.conf, применяется
# `sysctl --system` или перезагрузкой.
#
# Правило файла: у каждой строки есть обоснование, и в обосновании стоит
# идентификатор измерения из data/measurements.txt. Параметр без измерения
# — это не настройка, а суеверие, и через год никто не вспомнит, зачем он
# здесь и можно ли его убрать.

# M1: очередь принятия переполнялась 184 раза в минуту, и каждое
# переполнение — молча отброшенное соединение. Приложение просит
# listen(3, 4096) (M3), а ядро урезает до 128 (M2): разница и уходит в
# TcpExtListenOverflows. Ставим столько, сколько приложение просит.
net.core.somaxconn = 4096

# M1, вторая половина той же очереди: somaxconn ограничивает уже
# установленные соединения, ожидающие accept(), а tcp_max_syn_backlog —
# полуоткрытые, ожидающие завершения рукопожатия. Поднимать надо оба,
# иначе узкое место просто переезжает.
net.ipv4.tcp_max_syn_backlog = 4096

# M4: таблица отслеживания соединений заполнена на 90 % (118000 из 131072
# по M5). Переполнение отбрасывает пакеты и пишет в журнал ядра, но
# приложение об этом не узнаёт. Двукратный запас к наблюдаемому: всплеск
# удваивает число соединений быстрее, чем человек успевает отреагировать.
net.netfilter.nf_conntrack_max = 262144

# M6: на пике открыто 14800 дескрипторов при системном пределе 16384 (M7).
# Тот же двукратный запас. Отдельно надо помнить, что предел процесса
# (LimitNOFILE в unit-файле) считается независимо от системного.
fs.file-max = 32768

# Чего здесь нет и почему:
#
#   vm.swappiness            — подкачка не используется вовсе (M9)
#   net.ipv4.tcp_tw_reuse    — влияет на исходящие соединения, у нас
#                              входящие (M8)
#   net.ipv4.tcp_timestamps  — выключение ломает PAWS и оценку RTT
#   net.ipv4.tcp_syncookies  — это защита, а не тюнинг
#   net.ipv4.tcp_tw_recycle  — удалён из ядра в 4.12
#
# Каждый из них есть в файле, принесённом из блога. Ни у одного нет
# измерения, которое бы его оправдывало.
