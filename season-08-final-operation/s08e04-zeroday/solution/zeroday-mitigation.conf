# zeroday-mitigation.conf — временная мера против NE-2026-0041 (ЭТАЛОН)
#
# Подключается из server-блока aurora-api до общего location /.
# Мера временная, и три строки ниже — часть меры, а не оформление:
# без них она останется в конфигурации навсегда.
#
# advisory: NE-2026-0041
# expires: день 64 операции
# remove-when: nginx-module-upload 2.4.2 выкачен на все 50 узлов и
#              проверен; после этого блок удаляется целиком, а не
#              оставляется «на всякий случай»
#
# Что делает: закрывает ровно то сочетание, при котором исполняется код, —
# путь /api/upload с кодировкой chunked или с телом свыше 512 КБ. Всё
# остальное к этому пути продолжает работать: три с половиной тысячи
# законных загрузок в сутки — это не «второстепенный трафик».

location = /api/upload {
    # Первое условие из advisory. Тело свыше 512 КБ отклоняется на входе,
    # до того как его начнёт разбирать уязвимый модуль.
    client_max_body_size 512k;

    # Второе условие. Клиенты aurora chunked не используют — проверено по
    # корпусу за час: ни одного законного запроса с этой кодировкой.
    if ($http_transfer_encoding ~* chunked) {
        return 403;
    }

    # Сузить поверхность заодно: GET к этому пути клиентами не
    # используется, а модуль обрабатывает его тем же кодом.
    limit_except POST {
        deny all;
    }

    # Отдельный журнал — иначе не узнать, работает ли мера и когда её
    # можно снимать. Отсутствие срабатываний тоже сведение.
    access_log /var/log/nginx/zeroday-NE-2026-0041.log combined;

    proxy_pass http://aurora_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
