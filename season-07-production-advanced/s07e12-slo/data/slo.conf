# Соглашение об уровне обслуживания aurora-api — то, о чём договорились с
# заказчиком 55-го дня операции.
#
# Всё в миллионных долях (ppm), чтобы не сравнивать дроби: 995000 ppm —
# это 99.5 %. Целые числа переносимы между машинами и локалями, проценты
# с плавающей точкой — нет.

# Окно, за которое считается бюджет.
window_days 30

# Доля израсходованного бюджета, после которой SLO считается «горит».
budget_warn_pct 75

# ── сами показатели ──────────────────────────────────────────────
#
# slo <имя> target_ppm=<n> sli=<ключ измерения>
#
# availability: успешным считается запрос, не ответивший пятисоткой.
slo availability target_ppm=995000 sli=requests
# latency: успешным считается запрос быстрее 300 мс. Граница корзины
# гистограммы стоит ровно здесь — иначе показатель нельзя было бы
# посчитать без интерполяции (см. s07e09).
slo latency      target_ppm=990000 sli=latency

# ── скорость расхода ─────────────────────────────────────────────
#
# burn <окно> rate_x100=<во сколько раз быстрее допустимого>
#
# Множители из практики SRE: за час на 14.4 расходуется 2 % месячного
# бюджета, за шесть часов на 6 — 5 %. Первое будит, второе заводит задачу.
burn 1h rate_x100=1440
burn 6h rate_x100=600
