# Действующий фрагмент конфигурации aurora-api, узел verne-edge2.
# Снят в 10:55 UTC, до правок. Уязвимый путь обслуживается как все
# остальные: никаких ограничений на него нет.

upstream aurora_backend {
    server 10.20.4.11:8080;
    server 10.20.4.12:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name aurora.example.is;

    client_max_body_size 64m;
    access_log /var/log/nginx/aurora.access.log combined;

    location / {
        proxy_pass http://aurora_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
