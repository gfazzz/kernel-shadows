# ─────────────────────────────────────────────────────────────
# SHADOW AGENT — конфигурация канала связи (ЭТАЛОН)
# Открывать после своей попытки.
#
# Значения взяты из ../data/test_environment/.next_server:
#   IP Address: 185.192.45.119   Port: 2223   Username: max_operator
# ─────────────────────────────────────────────────────────────

# Адрес узла, к которому подключается агент
server = 185.192.45.119

# Порт SSH
port = 2223

# Имя пользователя
user = max_operator

# Шифрование канала. Включить обязательно:
encryption = on

# Отладочный лог пишет в открытом виде всё, включая параметры доступа.
# Перед боевым подключением должен быть выключен.
debug_log = false

# Таймаут подключения в секундах (менять не нужно)
timeout = 30
