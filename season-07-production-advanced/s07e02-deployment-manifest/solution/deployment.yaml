# deployment.yaml — манифест aurora-api (ЭТАЛОН)
#
# Над каждым числом — откуда оно взято. Ни одно не выбрано «на глаз»:
# это и есть разница между манифестом и списком пожеланий.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-api
  namespace: aurora
  labels:
    app: aurora-api
spec:
  # Столько же, сколько заказано сейчас. Задача серии — не менять желаемое,
  # а сделать так, чтобы кластер смог его исполнить.
  replicas: 5

  # Селектор обязан быть подмножеством меток шаблона, иначе Deployment не
  # найдёт собственные поды. Поле неизменяемое: ошиблись — пересоздавать.
  selector:
    matchLabels:
      app: aurora-api

  template:
    metadata:
      labels:
        app: aurora-api
    spec:
      containers:
        - name: aurora-api
          # Тег из registry_tags.txt. Не latest: подвижный тег означает, что
          # два пода одного Deployment могут работать на разных образах —
          # ровно то, что случилось с aurora-worker в s07e01.
          image: registry.verne.internal/aurora-api:v2.4.2

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              # p50 памяти — 180 Mi. requests — это место, которое планировщик
              # резервирует навсегда, значит меряется обычной жизнью, а не
              # пиком. 192 Mi = 180 с небольшим округлением вверх.
              #
              # Проверка размещения: свободно 632 / 672 / 180 Mi на трёх узлах.
              # 632/192 = 3, 672/192 = 3 — пять реплик встают. При прежних
              # 256 Mi выходило 2 + 2 + 0 = 4, и пятая вставала в Pending.
              memory: 192Mi
              # p50 процессора — 210 m, округлено вверх.
              cpu: 250m
            limits:
              # max за неделю — 372 Mi, запас 15 % даёт 428. 512 Mi — ближайшая
              # разумная величина сверху. Предыдущие 256 Mi были ниже пика,
              # и каждый всплеск заканчивался OOMKilled с кодом 137.
              memory: 512Mi
              # max процессора — 610 m. Предел ниже пика не убивает, а
              # тормозит: всплеск превращается в задержку. Ставить cpu-предел
              # вообще не обязательно; если ставить — то не ниже измеренного.
              cpu: 750m

          # DSN содержит пароль, а манифест лежит в git. Значение приходит из
          # Secret по ссылке — в файле остаётся только имя ключа.
          # Отсутствие этой переменной и роняло под dk3np в s07e01.
          env:
            - name: AURORA_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: aurora-db
                  key: dsn
            - name: AURORA_MESH_URL
              value: http://mesh-collector:9000
            - name: AURORA_LOG_JSON
              value: "true"

          # Старт занимает 38 секунд: 33 из них — загрузка таблицы маршрутов.
          # Бюджет 5 * 12 = 60 секунд, то есть полуторный запас: таблица растёт
          # вместе с сетью и завтра будет грузиться дольше.
          # Пока startupProbe не прошла, две другие пробы не запускаются —
          # именно это и защищает медленный старт от пробы живости.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 12

          # Готовность спрашивает зависимости: пул postgres и таблицу
          # маршрутов. Не прошла — под убирают из Service, но не трогают.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 3

          # Живость спрашивает только себя. Если бы она ходила в postgres,
          # падение базы перезапустило бы все пять реплик разом.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
