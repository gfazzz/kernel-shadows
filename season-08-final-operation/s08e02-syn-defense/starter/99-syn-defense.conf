# 99-syn-defense.conf — параметры стека под SYN-флудом (СТАРТЕР)
#
# Кладётся в /etc/sysctl.d/, применяется `sysctl --system`.
#
# Каркас называет, что нужно решить. Какие именно значения поставить —
# выводится из наблюдений в data/, а не берётся из статьи в интернете:
#
#   current_sysctl.txt    что стоит сейчас
#   available_sysctl.txt  какие ключи вообще есть в этом ядре
#   conn_baseline.txt     обычный темп новых соединений
#
# Правило то же, что в s07e10: **параметр без причины — суеверие**.
# Здесь оно жёстче: каждая строка должна быть снабжена комментарием,
# из которого видно, почему выбрано это значение. Тест это проверяет.
#
# Правь копию в artifacts/, потом:  bash tests/test.sh

# ── 1. Не хранить состояние по тем, кто не завершает рукопожатие ──
#
# У параметра три значения, и два из них неверны. Разберись, чем
# отличаются 1 и 2, прежде чем выбрать.
net.ipv4.tcp_syncookies =

# ── 2. Очереди ──
#
# Очередь полуоткрытых и очередь принятия. Обе сейчас по 128.
# Посмотри в conn_baseline.txt, сколько новых соединений приходит в
# обычный день, и реши, что с этим числом не так.
net.ipv4.tcp_max_syn_backlog =
net.core.somaxconn =

# ── 3. Сколько держать то, что не завершится ──
#
# Каждый повтор SYN+ACK удваивает ожидание. Сейчас повторов пять.
net.ipv4.tcp_synack_retries =

# ── 4. Параметр, который надо выставить сознательно, а не забыть ──
#
# Про него пишут, что он «помогает при переполнении». Выясни, кому
# именно он помогает, и поставь то значение, которое считаешь верным.
net.ipv4.tcp_abort_on_overflow =

# ── 5. Очередь между драйвером и стеком ──
net.core.netdev_max_backlog =

# ── 6. Обратная проверка маршрута ──
#
# Часть подделанных адресов отсекается бесплатно, до правил фильтра.
net.ipv4.conf.all.rp_filter =

# ── 7. Таблица отслеживания соединений ──
net.netfilter.nf_conntrack_max =
